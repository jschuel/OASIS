[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "OASIS"
version = "0.0.1"
requires-python = ">=3.10"
dependencies=[
        "numpy<2.0.0",
        "pandas>=1.0.0",
        "matplotlib>=3.2.0",
        "tqdm>=4.41.1",
        "notebook",
        "cmasher",
        "unzip",
    ]
[tool.setuptools]
packages = ["OASIS"]
